# 通用控制参数。关节维增益可用标量，运行时按机器人 nv 广播。
# 末端 frame 留空时，由程序填 URDF 中最后一个 body frame。

safety:
  q_lower: -3.14
  q_upper: 3.14
  dq_max: 4.0
  ddq_max: 10.0
  tau_max: 100.0
  tau_rate_max: 1000.0

computed_torque:
  kp: 100.0
  kd: 20.0

joint_impedance:
  stiffness: 80.0
  damping: 12.0

cartesian_impedance:
  stiffness: [200.0, 200.0, 200.0, 20.0, 20.0, 20.0]
  # damping 省略时按临界阻尼 2*sqrt(stiffness) 补齐
  nullspace_stiffness: 0.0
  nullspace_damping: 0.0
  end_effector_frame: ""

operational_space:
  stiffness: [200.0, 200.0, 200.0, 20.0, 20.0, 20.0]
  end_effector_frame: ""
  jacobian_reference: local  # local | local_world_aligned
  operational_space_regularization: 0.01
  nullspace_regularization: 1.0e-4
  nullspace_projector: dynamic  # dynamic | kinematic | none
  limit_error: true
  error_clip: [0.1, 0.1, 0.1, 0.3, 0.3, 0.3]
  use_friction: false
  use_coriolis: true
  use_gravity: true
  use_joint_limit_repulsion: true
  joint_limit_safe_range: 0.3
  joint_limit_max_torque: 5.0
  nullspace_stiffness: 0.0
  nullspace_max_torque: 10.0
  target_filter_alpha: 0.0
